<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabourConnect - Daily Labour Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [view, setView] = useState('home'); // home, search, profile, bookings, sos
            const [workers, setWorkers] = useState([
                { id: 1, name: "Rajesh Kumar", skill: "Plumber", rating: 4.8, verified: true, distance: "0.5 km", price: "₹400/day", image: "https://api.dicebear.com/7.x/avataaars/svg?seed=Rajesh" },
                { id: 2, name: "Sunita Devi", skill: "Gardener", rating: 4.5, verified: true, distance: "1.2 km", price: "₹350/day", image: "https://api.dicebear.com/7.x/avataaars/svg?seed=Sunita" },
                { id: 3, name: "Amit Singh", skill: "Electrician", rating: 4.2, verified: false, distance: "2.5 km", price: "₹500/day", image: "https://api.dicebear.com/7.x/avataaars/svg?seed=Amit" },
            ]);
            const [language, setLanguage] = useState('English');

            const renderHeader = () => (
                <nav class="bg-blue-600 text-white p-4 shadow-lg sticky top-0 z-50">
                    <div class="container mx-auto flex justify-between items-center">
                        <h1 class="text-xl font-bold flex items-center" onClick={() => setView('home')}>
                            <i class="fas fa-hard-hat mr-2"></i> LabourConnect
                        </h1>
                        <div class="flex items-center space-x-4">
                            <select 
                                class="bg-blue-700 text-sm rounded px-2 py-1 outline-none"
                                value={language}
                                onChange={(e) => setLanguage(e.target.value)}
                            >
                                <option>English</option>
                                <option>Hindi</option>
                                <option>Marathi</option>
                            </select>
                            <button class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold" onClick={() => setView('sos')}>
                                SOS
                            </button>
                        </div>
                    </div>
                </nav>
            );

            const Home = () => (
                <div class="p-4 space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Find Skilled Help Near You</h2>
                        <p class="text-gray-500 mb-4">Connecting verified daily labourers with local needs.</p>
                        <div class="relative">
                            <input type="text" placeholder="Search for Plumber, Electrician..." class="w-full p-4 pl-12 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none" />
                            <i class="fas fa-search absolute left-4 top-5 text-gray-400"></i>
                        </div>
                    </div>

                    <div>
                        <h3 class="font-bold text-gray-700 mb-3">Popular Categories</h3>
                        <div class="grid grid-cols-3 gap-3">
                            {['Plumbing', 'Cleaning', 'Gardening', 'Construction', 'Electrical', 'Painting'].map(cat => (
                                <div key={cat} class="bg-white p-3 rounded-lg shadow-sm border border-gray-50 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-blue-50 transition">
                                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2">
                                        <i class={`fas ${cat === 'Plumbing' ? 'fa-faucet' : 'fa-tools'}`}></i>
                                    </div>
                                    <span class="text-xs font-medium">{cat}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <h3 class="font-bold text-gray-700 mb-3">Nearby Workers</h3>
                        <div class="space-y-3">
                            {workers.map(worker => (
                                <div key={worker.id} class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
                                    <img src={worker.image} class="w-16 h-16 rounded-full bg-gray-100" />
                                    <div class="flex-1">
                                        <div class="flex items-center">
                                            <h4 class="font-bold text-gray-800">{worker.name}</h4>
                                            {worker.verified && <i class="fas fa-check-circle text-blue-500 text-xs ml-2"></i>}
                                        </div>
                                        <p class="text-sm text-gray-500">{worker.skill} • {worker.distance}</p>
                                        <div class="flex items-center mt-1 text-sm">
                                            <span class="text-yellow-500 mr-1">★</span>
                                            <span class="font-medium">{worker.rating}</span>
                                            <span class="mx-2 text-gray-300">|</span>
                                            <span class="text-green-600 font-bold">{worker.price}</span>
                                        </div>
                                    </div>
                                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Book</button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const SOSView = () => (
                <div class="p-6 text-center">
                    <div class="w-32 h-32 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse">
                        <i class="fas fa-bell text-5xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Emergency Assistance</h2>
                    <p class="text-gray-600 mb-8">Press the button below to notify emergency services and your nearby contacts.</p>
                    <button class="w-full bg-red-600 text-white py-4 rounded-2xl text-xl font-bold shadow-xl shadow-red-200 active:scale-95 transition" onClick={() => alert('Emergency Alert Sent!')}>
                        TRIGGER ALARM
                    </button>
                    <button class="mt-4 text-gray-500 font-medium" onClick={() => setView('home')}>Cancel</button>
                </div>
            );

            const BottomNav = () => (
                <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-3 z-50">
                    <button onClick={() => setView('home')} class={`flex flex-col items-center ${view === 'home' ? 'text-blue-600' : 'text-gray-400'}`}>
                        <i class="fas fa-home"></i>
                        <span class="text-[10px] mt-1">Home</span>
                    </button>
                    <button onClick={() => setView('bookings')} class={`flex flex-col items-center ${view === 'bookings' ? 'text-blue-600' : 'text-gray-400'}`}>
                        <i class="fas fa-calendar-alt"></i>
                        <span class="text-[10px] mt-1">Bookings</span>
                    </button>
                    <button onClick={() => setView('wallet')} class={`flex flex-col items-center ${view === 'wallet' ? 'text-blue-600' : 'text-gray-400'}`}>
                        <i class="fas fa-wallet"></i>
                        <span class="text-[10px] mt-1">Earnings</span>
                    </button>
                    <button onClick={() => setView('profile')} class={`flex flex-col items-center ${view === 'profile' ? 'text-blue-600' : 'text-gray-400'}`}>
                        <i class="fas fa-user"></i>
                        <span class="text-[10px] mt-1">Profile</span>
                    </button>
                </div>
            );

            return (
                <div class="max-w-md mx-auto bg-white min-h-screen pb-20 relative shadow-2xl">
                    {renderHeader()}
                    {view === 'home' && <Home />}
                    {view === 'sos' && <SOSView />}
                    {view === 'bookings' && <div class="p-4 text-center text-gray-500 mt-20 italic">No active bookings.</div>}
                    {view === 'wallet' && (
                        <div class="p-6">
                            <h2 class="text-xl font-bold mb-4">Worker Earnings</h2>
                            <div class="bg-blue-600 text-white p-6 rounded-2xl mb-6">
                                <p class="text-sm opacity-80 text-white">Total Balance</p>
                                <h3 class="text-3xl font-bold">₹4,250</h3>
                            </div>
                            <div class="space-y-4">
                                <div class="flex justify-between items-center p-3 border-b">
                                    <div>
                                        <p class="font-bold">House Painting</p>
                                        <p class="text-xs text-gray-400">July 28, 2026</p>
                                    </div>
                                    <span class="text-green-600 font-bold">+₹1,200</span>
                                </div>
                            </div>
                        </div>
                    )}
                    <BottomNav />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
